<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prácticas Loop While 1</title>
</head>
<body>

    <script>
        function contarVueltas(maximo) {
            let contador = 1;
            while (contador <= maximo) {
                alert("Vuelta número: " + contador);
                contador++;
            }
        }

        let numero = prompt("¿Cuántas vueltas quieres dar?");
        contarVueltas(numero);
    </script>

</body>
</html>
