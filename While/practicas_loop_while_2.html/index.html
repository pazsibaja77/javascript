<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prácticas Loop While 2</title>
</head>
<body>

    <script>
        function testLoop(numero) {
            while (numero <= 10) {
                console.log(numero);
                numero++;
            }
        }

        let numeroUsuario = prompt("Ingresa un número menor a 10:");
        testLoop(numeroUsuario);
    </script>

</body>
</html>
