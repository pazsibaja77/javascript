<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina 2</title>
    <style>
        body{
            background-color: palevioletred;
        }
    </style>
</head>
<body>
    <script>
        function ponerTituloPink(){
            document.getElementById("titulo")
            style = "color: Pink"
        }
        function ponerTituloBlack(){
            document.getElementById("titulo").
            style = "color: Black"
        }
    </script>
    <h1 id="titulo"
    onmouseover= "ponerTituloPink()"
    onmouseout= "ponerTituloBlack()"
    >Bienvenido a Javascript</h1>
    <h2>El primer paso es el mas grande</h2>
    <p>Esta pagina es muy sencilla </p>
    <p>(pero tiene un secreto >>> Presiona F12)</p>
    
</body>
</html>
