<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Loop For 1</title>
</head>
<body>
    <script>
        function testLoop() {
            for (let i = 0; i < 5; i++) {
                document.write(i + " Paz" + "<br>");
            }
        }

        testLoop();
    </script>
</body>
</html>
